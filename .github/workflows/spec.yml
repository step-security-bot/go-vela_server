# name of the action
name: spec

# trigger on release events
on:
  release:
    types: [ created ]

# pipeline to execute
permissions:
  contents: read

jobs:
  schema:
    permissions:
      actions: write  # for skx/github-action-publish-binaries to attach binaries to release artifacts
      contents: read  # for actions/checkout to fetch code
    runs-on: ubuntu-latest

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
      with:
        egress-policy: audit

    - name: clone
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: install go
      uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
      with:
        # use version from go.mod file
        go-version-file: 'go.mod'
        cache: true
        check-latest: true

    - name: tags
      run: |
        git fetch --tags

    - name: create spec
      run: |
        make spec-install
        make spec

    - name: upload spec
      uses: skx/github-action-publish-binaries@44887b225ceca96efd8a912d39c09ad70312af31 # master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        args: 'api-spec.json'
